# .github/workflows/daily-predict.yml
name: 🎯 Daily AI Prediction

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          # ❌ cache オプションを削除（これが原因）
      
      - name: 📦 Install ml_engine dependencies
        run: |
          cd ml_engine
          pip install --upgrade pip
          pip install -r requirements.txt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      
      - name: 🤖 Train LightGBM model
        run: |
          cd ml_engine
          python train_lgbm.py || echo "Training skipped"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      
      - name: 🔮 Run LightGBM prediction
        run: |
          cd ml_engine
          python predict_lgbm.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      
      - name: 🎨 Run Gemini prediction
        run: |
          cd ml_engine
          python predict_gemini.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      
      - name: ✅ Log completion
        run: |
          echo "🎉 Prediction completed at $(date)"