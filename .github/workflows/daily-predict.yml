# .github/workflows/daily-predict.yml
name: 🎯 Daily AI Prediction

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      # この行が動く前提：ml_engine/requirements.txt が GitHub に含まれている
      - run: pip install -r ml_engine/requirements.txt
      
      - run: cd ml_engine && python train_lgbm.py || true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      
      - run: cd ml_engine && python predict_lgbm.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      
      - run: cd ml_engine && python predict_gemini.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}